[package]
name = "labcorp-cli"
description = "Unofficial read-only CLI for Labcorp lab results and report PDFs from Labcorp Patient (health-records/v1)."
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/labcorp-cli"
authors = ["piekstra"]
publish = false

[lib]
name = "labcorp"
path = "src/lib.rs"

[[bin]]
name = "labcorp"
path = "src/main.rs"

[dependencies]
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-documents = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
# `auth login --browser` (src/auth.rs, src/site.rs).
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-med-records = { git = "https://github.com/piekstra/medical-common", tag = "v0.6.3" }
pk-med-fhir = { git = "https://github.com/piekstra/medical-common", tag = "v0.6.3" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The unit tests build a `Captured` by hand and move the kept profile to a
# temp dir. A dev-dependency only, so the binary is built without them.
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
